appId: com.wassermanproductions.blockout
productName: Blockout
directories:
  output: release
files:
  - out/**
  - package.json
  # ffmpeg-static is external to the main bundle — ship the real package
  # (the binary is what makes exports work on machines without ffmpeg).
  - node_modules/ffmpeg-static/**
asarUnpack:
  - node_modules/ffmpeg-static/**
# Swap in the ffmpeg binary for the TARGET OS/arch (npm only installs the
# build machine's) — required for the Windows .exe and the Intel DMG.
afterPack: build/ffmpeg-hook.cjs
mac:
  category: public.app-category.video
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
  # Unsigned by default. For distribution beyond your own machines, set
  # identity + notarize (Apple Developer ID) — see README "Sharing builds".
  identity: null
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # Unsigned by default: Windows SmartScreen shows "More info → Run anyway".
  # For distribution, add a code-signing certificate (win.signtoolOptions).
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Blockout
  artifactName: ${productName}-${version}-Setup.${ext}
portable:
  artifactName: ${productName}-${version}-Portable.${ext}
linux:
  target: AppImage
  category: Video
npmRebuild: false
